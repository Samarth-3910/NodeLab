<!DOCTYPE html>
<html>

<body>
    <h3>Search</h3>
    <input id="emailBox" placeholder="Email">
    <button onclick="searchStudent()">Search</button>
    <p id="searchRes"></p>

    <h3>Delete</h3>
    <input id="idBox" placeholder="ID">
    <button onclick="deleteStudent()">Delete</button>
    <p id="deleteRes"></p>

    <h3>Students Table</h3>
    <table border="1" cellpadding="5" style="border-collapse: collapse; text-align: left;">
        <tr style="background-color: #f2f2f2;">
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Year</th>
            <th>Email</th>
        </tr>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        async function loadTable() {
            let response = await fetch('/students');
            let data = await response.json();
            let html = '';
            for (let s of data) {
                html += `<tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.course}</td>
                    <td>${s.year}</td>
                    <td>${s.email}</td>
                </tr>`;
            }
            document.getElementById('tbody').innerHTML = html;
        }

        async function searchStudent() {
            let email = document.getElementById('emailBox').value;
            let response = await fetch('/students/search/' + email);
            let data = await response.json();
            document.getElementById('searchRes').innerText = JSON.stringify(data);
        }

        async function deleteStudent() {
            let id = document.getElementById('idBox').value;
            let response = await fetch('/students/' + id, { method: 'DELETE' });
            let text = await response.text();
            document.getElementById('deleteRes').innerText = text;
            loadTable();
        }

        loadTable();
    </script>
</body>

</html>
